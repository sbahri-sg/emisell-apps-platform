name: emisell-app-platform-production

services:
  frontend:
    image: ${FRONTEND_IMAGE:-emisell/app-platform-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
        NEXT_PUBLIC_APP_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:?PUBLIC_GATEWAY_URL is required}
        NEXT_PUBLIC_AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-emisell_csrf}
        NEXT_PUBLIC_MERCHANT_CSRF_COOKIE_NAME: ${MERCHANT_CSRF_COOKIE_NAME:-emisell_merchant_csrf}
    init: true
    environment:
      NODE_ENV: production
      PORT: "3003"
      HOST: 0.0.0.0
      APP_GATEWAY_INTERNAL_URL: http://app-gateway:8080
      AUTH_SESSION_COOKIE_NAME: emisell_session
      NEXT_PUBLIC_ENABLE_DEVELOPMENT_LOGIN: "false"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3003}:3003"
    depends_on:
      app-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/admin/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    restart: unless-stopped

  app-gateway:
    image: ${APP_GATEWAY_IMAGE:-emisell/app-gateway:local}
    build:
      context: ./services/app-gateway
      dockerfile: Dockerfile
    init: true
    environment:
      APP_ENV: production
      HTTP_ADDRESS: :8080
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:?PUBLIC_GATEWAY_URL is required}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:?FRONTEND_URL is required}
      REPOSITORY_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-2}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
      SECRET_ENCRYPTION_KEY_BASE64: ${SECRET_ENCRYPTION_KEY_BASE64:?SECRET_ENCRYPTION_KEY_BASE64 is required}
      SECRET_ENCRYPTION_KEY_VERSION: ${SECRET_ENCRYPTION_KEY_VERSION:-1}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:?AUTH_JWT_KEY_ID is required}
      AUTH_JWT_PUBLIC_KEY_BASE64: ${AUTH_JWT_PUBLIC_KEY_BASE64:?AUTH_JWT_PUBLIC_KEY_BASE64 is required}
      AUTH_JWT_CLOCK_SKEW: ${AUTH_JWT_CLOCK_SKEW:-30s}
      EMISELL_BACKEND_JWT_ISSUER: ${EMISELL_BACKEND_JWT_ISSUER:?EMISELL_BACKEND_JWT_ISSUER is required}
      EMISELL_BACKEND_JWT_AUDIENCE: ${EMISELL_BACKEND_JWT_AUDIENCE:?EMISELL_BACKEND_JWT_AUDIENCE is required}
      EMISELL_BACKEND_JWT_KEY_ID: ${EMISELL_BACKEND_JWT_KEY_ID:?EMISELL_BACKEND_JWT_KEY_ID is required}
      EMISELL_BACKEND_JWT_PUBLIC_KEY_BASE64: ${EMISELL_BACKEND_JWT_PUBLIC_KEY_BASE64:?EMISELL_BACKEND_JWT_PUBLIC_KEY_BASE64 is required}
      EMISELL_BACKEND_JWT_CLOCK_SKEW: ${EMISELL_BACKEND_JWT_CLOCK_SKEW:-30s}
      EMISELL_BACKEND_SESSION_GRANT_TTL: ${EMISELL_BACKEND_SESSION_GRANT_TTL:-2m}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
      AUTH_SESSION_IDLE_TTL: ${AUTH_SESSION_IDLE_TTL:-2h}
      AUTH_SESSION_COOKIE_NAME: emisell_session
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-emisell_csrf}
      MERCHANT_SESSION_COOKIE_NAME: emisell_merchant_session
      MERCHANT_CSRF_COOKIE_NAME: ${MERCHANT_CSRF_COOKIE_NAME:-emisell_merchant_csrf}
      ADMIN_PLATFORM_ORGANIZATION_ID: ${ADMIN_PLATFORM_ORGANIZATION_ID:?ADMIN_PLATFORM_ORGANIZATION_ID is required}
      AUTH_OIDC_ENABLED: ${AUTH_OIDC_ENABLED:-false}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_AUTHORIZATION_ENDPOINT: ${AUTH_OIDC_AUTHORIZATION_ENDPOINT:-}
      AUTH_OIDC_TOKEN_ENDPOINT: ${AUTH_OIDC_TOKEN_ENDPOINT:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_REDIRECT_URL: ${AUTH_OIDC_REDIRECT_URL:-}
      AUTH_OIDC_KEY_ID: ${AUTH_OIDC_KEY_ID:-}
      AUTH_OIDC_PUBLIC_KEY_BASE64: ${AUTH_OIDC_PUBLIC_KEY_BASE64:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid,profile,email}
      DEVELOPER_INVITATION_TTL: ${DEVELOPER_INVITATION_TTL:-48h}
      OAUTH_CODE_TTL: ${OAUTH_CODE_TTL:-5m}
      OAUTH_ACCESS_TOKEN_TTL: ${OAUTH_ACCESS_TOKEN_TTL:-1h}
      EXTENSION_CONNECTIONS_ENABLED: ${EXTENSION_CONNECTIONS_ENABLED:-false}
      APP_BILLING_ENABLED: ${APP_BILLING_ENABLED:-false}
      APP_BILLING_LIVE_ENABLED: "false"
      EMISELL_RESOURCE_ENABLED: "false"
      API_KURIR_RATES_ENABLED: ${API_KURIR_RATES_ENABLED:-false}
      API_KURIR_BASE_URL: ${API_KURIR_BASE_URL:-}
      API_KURIR_SERVICE_KEY: ${API_KURIR_SERVICE_KEY:-}
      API_KURIR_RATES_TIMEOUT: ${API_KURIR_RATES_TIMEOUT:-5s}
      WEBHOOK_POLL_INTERVAL: ${WEBHOOK_POLL_INTERVAL:-1s}
      WEBHOOK_REQUEST_TIMEOUT: ${WEBHOOK_REQUEST_TIMEOUT:-8s}
      WEBHOOK_BATCH_SIZE: ${WEBHOOK_BATCH_SIZE:-25}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_BASE_RETRY: ${WEBHOOK_BASE_RETRY:-5s}
      WEBHOOK_MAX_RETRY: ${WEBHOOK_MAX_RETRY:-15m}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app-gateway-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

  migrate:
    image: ${APP_GATEWAY_IMAGE:-emisell/app-gateway:local}
    build:
      context: ./services/app-gateway
      dockerfile: Dockerfile
    entrypoint: ["/app-gateway-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_MAX_CONNECTIONS: "2"
      DATABASE_MIN_CONNECTIONS: "0"
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_production_data:
