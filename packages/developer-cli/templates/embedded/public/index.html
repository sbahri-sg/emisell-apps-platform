<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emisell Embedded Starter</title>
  <link rel="stylesheet" href="/emisell-ui.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body class="eui">
  <main class="eui-page eui-stack">
    <header class="eui-header">
      <h1 class="eui-title">Embedded Starter</h1>
      <span class="eui-badge">Development</span>
    </header>
    <section class="eui-card eui-stack" aria-labelledby="connection-title">
      <h2 class="eui-heading" id="connection-title">Koneksi Dashboard</h2>
      <p>Starter UI aplikasi, tanpa duplikasi navigasi Dashboard seller.</p>
      <div class="eui-banner" role="status" id="status">Memuat konfigurasi lokal…</div>
      <button class="eui-button" type="button" id="connect" disabled>Periksa koneksi</button>
      <p>Tidak ada akses order, produk atau pengiriman. Identitas harus diverifikasi oleh backend aplikasi sebelum digunakan.</p>
    </section>
  </main>
</body>
</html>
