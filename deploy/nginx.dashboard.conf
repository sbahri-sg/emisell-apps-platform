# TLS must terminate at the existing upstream proxy. Preserve the public Host.
server {
    listen 8080;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    # Backend-only Core ingress; the API checks key, procedure and body itself.
    location /api/v1/core/rpc/ {
        client_max_body_size 32k;
        proxy_pass http://api:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
        access_log off;
    }
    location /api/v1/developer-login/ {
        proxy_pass http://api:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream off;
        access_log off;
    }
    location ~ ^/api/v1/(admin|developer|portal)/ {
        proxy_pass http://api:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ { return 404; }
    location / {
        proxy_pass http://admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
